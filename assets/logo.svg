<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fondo cuadrado (puedes ajustar rx para más o menos redondeo en las esquinas) -->
  <rect width="100" height="100" rx="16" fill="#111111"/>
  
  <!-- Isotipo ampliado al máximo (Ajustado al borde) -->
  <g transform="translate(50, 50) scale(2.65) translate(-28, -26)">
    <!-- Ala izquierda (Blanco) -->
    <path d="M 12,42 L 28,10 L 28,26 L 18,42 Z" fill="#FFFFFF" />
    <!-- Ala derecha (Naranja Neón) -->
    <path d="M 28,10 L 44,42 L 34,42 L 28,26 Z" fill="#FF3B00" />
  </g>
</svg>
